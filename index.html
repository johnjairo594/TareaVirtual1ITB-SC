<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Sweet&Coffee</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <header>
        <!-- Enlaces marrón -->
        <div id="first-header">
            <!-- Enlaces -->
            <div id="first-header-links">
                <a class="first-header-link" href="#">Factura electrónica</a>
                <a class="first-header-link" href="#">Nutricional</a>
                <a class="first-header-link" href="#">Pet Lovers</a>
                <a class="first-header-link" href="#">Nuestro Café</a>
                <a class="first-header-link" href="#">Política de privacidad</a>
                <a class="first-header-link" href="#">Términos y condiciones</a>
            </div>
            
            <!-- Redes -->
            <div id="header-social-media-icons">
                <a href="#"><img class="social-media-icons" src="img/SC-TWITTER.png" alt=""></a>
                <a href="#"><img class="social-media-icons" src="img/SC-FACEBOOK.png" alt=""></a>
                <a href="#"><img class="social-media-icons" src="img/SC-INSTAGRAM.png" alt=""></a>
            </div>
        </div>
    </header>

    <nav>
        <div id="logo-container">
            <img src="img/SC-LOGO-HORIZONTAL.png" alt="">
        </div>
        <div id="nav-links">
            <a   href="#">Nosotros</a>
            <a   href="#">Procesos</a>
            <a   href="#">Menú</a>
            <a   href="#">Locales</a>
            <a   href="#">Compromiso</a>
            <a   href="#">Talento</a>
            <a   id="nav-link-special" href="#">PEDIDOS EN LÍNEA</a>
        </div>
    </nav>
    
    <!-- Carousel -->
    <div id="carouselExampleControls" class="carousel slide" data-ride="carousel">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img class="d-block w-100" src="img/KV-DMadre25-Web-Banner-V1.jpg" alt="First slide">
          </div>
          <div class="carousel-item">
            <img class="d-block w-100" src="img/Galatea-Web-Banner-min.jpg" alt="Second slide">
          </div>
          <div class="carousel-item">
            <img class="d-block w-100" src="img/Kandu-2023-Web-Banner-min.jpg" alt="Third slide">
          </div>
          <div class="carousel-item">
            <img class="d-block w-100" src="img/Frappelatte-Cafe-Intenso-SweetCoffee-banner.jpg" alt="Fourth slide">
          </div>
          <div class="carousel-item">
            <img class="d-block w-100" src="img/BANNER-BROWNIE-COFFEE-SUNDAE.jpg" alt="Fifth slide">
          </div>
          <div class="carousel-item">
            <img class="d-block w-100" src="img/BANNER-MUSEO-CAFE.jpg" alt="Sixth slide">
          </div>
        </div>
        <a class="carousel-control-prev" href="#carouselExampleControls" role="button" data-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="sr-only">Previous</span>
        </a>
        <a class="carousel-control-next" href="#carouselExampleControls" role="button" data-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="sr-only">Next</span>
        </a>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</html>
